services:
  - type: web
    name: blueprintiq
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      npm --prefix frontend/blue_logic ci &&
      npm --prefix frontend/blue_logic run build
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: STOA_VISION_DEVICE
        value: cpu
      - key: STOA_VISION_DOWNLOAD_MODELS
        value: "false"
      - key: STOA_OCR_DOWNLOAD_MODELS
        value: "false"
