services:
  - type: web
    name: blueprintiq
    runtime: python
    plan: free
    buildCommand: >-
      python -m pip install -r requirements-vision.txt &&
      npm --prefix frontend/blue_logic ci &&
      npm --prefix frontend/blue_logic run build &&
      HF_HOME=.hf-cache python scripts/download_vision_models.py --models grounding-dino-tiny
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: STOA_VISION_DEVICE
        value: cpu
      - key: STOA_VISION_DOWNLOAD_MODELS
        value: "true"
      - key: HF_HOME
        value: /opt/render/project/src/.hf-cache
      - key: STOA_OCR_DOWNLOAD_MODELS
        value: "false"
